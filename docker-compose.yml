services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Ct8evxW90npjUENjvsaQfePmR
      MYSQL_DATABASE: api
      MYSQL_USER: admin
      MYSQL_PASSWORD: Ct8evxW90npjUENjvsaQfePmR
    ports:
      - "3306:3306"
    volumes:
      - mdmesh_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pCt8evxW90npjUENjvsaQfePmR"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
