services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mdmesh_root_pass
      MYSQL_DATABASE: device_manager
    ports:
      - "3306:3306"
    volumes:
      - mdmesh_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmdmesh_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: mdmesh_root_pass
      DB_NAME: device_manager
      JWT_SECRET: replace_this_in_production_with_64_random_chars_min
      JWT_EXPIRE: 24h
      ADMIN_ORIGIN: http://localhost:5000
      LOG_FILE: logs/server.log
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: password123

volumes:
  mdmesh_mysql:
