<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandiyan Agency</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="mesh"></div>
  <main class="login-shell">
    <section class="login-brand">
      <h1 class="brand-mark">Pandiyan <span>Agency</span></h1>
      <p>Fleet control for company phones and tablets. One app. One lock. Every device.</p>
    </section>
    <section class="login-panel">
      <form class="login-form" id="login-form" novalidate>
        <h1>Sign in</h1>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required minlength="3" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" />
        <div class="row-inline">
          <label><input type="checkbox" id="remember" /> Remember me</label>
        </div>
        <p class="form-error" id="login-error"></p>
        <button class="btn" type="submit" id="login-btn">Enter console</button>
      </form>
    </section>
  </main>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
